name: Finalize release

# Signed metadata is prepared at tag-scoped staging paths. Only this workflow
# can update the canonical feeds, after publication and anonymous HTTP checks.
on:
  workflow_run:
    workflows:
      - "Release Linux"
      - "Release macOS"
      - "Release Windows"
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to reconcile (no rebuild or retag)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

# Do not collapse sibling completion events into one pending concurrency slot.
concurrency:
  group: release-finalize-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Reconcile release and publish verified updater feeds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.ctx.outputs.tag }}
      ready: ${{ steps.gate.outputs.ready }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))

    steps:
      # Use maintained finalization logic so recovery need not rebuild an old
      # tag. Accept only tags whose commits are on main, never dispatch code.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate immutable tag
        id: ctx
        env:
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|dev)\.[0-9]+)?$ ]] || exit 1
          sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main
          [[ -z "$EXPECTED_SHA" || "$sha" == "$EXPECTED_SHA" ]] || exit 1
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Reconcile required platform workflows
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.ctx.outputs.tag }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: python3 scripts/release/publication.py wait "$TAG" "$SHA"

      - name: Checkout gh-pages staging
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --single-branch --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          git -C gh-pages config user.name "github-actions[bot]"
          git -C gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify payload, publish release, then notify updater clients
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.ctx.outputs.tag }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: python3 scripts/release/publication.py finish "$TAG" "$SHA"

  update-homebrew:
    name: Update Homebrew cask
    runs-on: macos-15
    timeout-minutes: 10
    needs: finalize
    if: needs.finalize.outputs.ready == 'true' && !contains(needs.finalize.outputs.tag, '-dev.')
    env:
      RELEASE_TAG: ${{ needs.finalize.outputs.tag }}

    steps:
      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          channel="stable"
          if [[ "$version" == *"-beta."* ]]; then
            channel="beta"
          elif [[ "$version" == *"-dev."* ]]; then
            channel="dev"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "channel=$channel" >>"$GITHUB_OUTPUT"

      - name: Download release artifacts
        if: steps.meta.outputs.channel != 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$RELEASE_TAG" --pattern '*-macos-*.dmg' --dir release-artifacts

      - name: Update cask formula
        if: steps.meta.outputs.channel != 'dev'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          version="${{ steps.meta.outputs.version }}"
          channel="${{ steps.meta.outputs.channel }}"

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping cask update"
            exit 0
          fi

          # Determine cask name
          if [[ "$channel" == "beta" ]]; then
            cask="con-beta"
            app_name="con Beta"
          else
            cask="con"
            app_name="con"
          fi

          # Compute SHA256 for each arch DMG
          arm64_dmg=$(find release-artifacts -name "*-macos-arm64.dmg" -type f | head -1)
          x86_64_dmg=$(find release-artifacts -name "*-macos-x86_64.dmg" -type f | head -1)

          arm64_sha=""
          x86_64_sha=""
          [[ -n "$arm64_dmg" ]] && arm64_sha=$(shasum -a 256 "$arm64_dmg" | cut -d' ' -f1)
          [[ -n "$x86_64_dmg" ]] && x86_64_sha=$(shasum -a 256 "$x86_64_dmg" | cut -d' ' -f1)

          if [[ -z "$arm64_sha" && -z "$x86_64_sha" ]]; then
            echo "::warning::No DMGs found — skipping cask update"
            exit 0
          fi

          # Pre-compute values to avoid mixing Ruby/bash syntax in heredoc
          dmg_prefix="${app_name// /-}"
          if [[ "$channel" == "beta" ]]; then
            bundle_suffix=".beta"
          else
            bundle_suffix=""
          fi

          # Clone tap and update cask
          git clone "https://x-access-token:${GH_TOKEN}@github.com/nowledge-co/homebrew-tap.git" tap
          cd tap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
          git fetch origin main
          git checkout --detach origin/main
          current=$(ruby -e 'puts File.read(ARGV[0])[/version "([^"]+)"/, 1]' "Casks/${cask}.rb" 2>/dev/null || true)
          if [[ -n "$current" ]] && ruby -e 'exit(Gem::Version.new(ARGV[0]) >= Gem::Version.new(ARGV[1]) ? 0 : 1)' "$current" "$version"; then
            echo "Homebrew already has $current; refusing to downgrade."
            exit 0
          fi

          cat > "Casks/${cask}.rb" <<EOF
          cask "${cask}" do
            version "${version}"

            on_arm do
              sha256 "${arm64_sha}"
              url "https://github.com/nowledge-co/con-terminal/releases/download/v#{version}/${dmg_prefix}-#{version}-macos-arm64.dmg"
            end

            on_intel do
              sha256 "${x86_64_sha}"
              url "https://github.com/nowledge-co/con-terminal/releases/download/v#{version}/${dmg_prefix}-#{version}-macos-x86_64.dmg"
            end

            name "${app_name}"
            desc "GPU-accelerated terminal emulator with built-in AI agent"
            homepage "https://github.com/nowledge-co/con-terminal"

            livecheck do
              url :url
              strategy :github_latest
              regex(/v?(\d+(?:\.\d+)*(?:-beta\.\d+)?)/i)
            end

            auto_updates true
            depends_on :macos

            app "${app_name}.app"
            binary "#{appdir}/${app_name}.app/Contents/MacOS/con-cli", target: "con-cli"

            zap trash: [
              "~/.config/con",
              "~/Library/Caches/co.nowledge.con${bundle_suffix}",
              "~/Library/Preferences/co.nowledge.con${bundle_suffix}.plist",
            ]
          end
          EOF
          sed -i '' 's/^          //' "Casks/${cask}.rb"

          git add "Casks/${cask}.rb"
          if git diff --cached --quiet; then
            echo "No cask changes"
            exit 0
          fi
          git commit -m "Update ${cask} to ${version}"
          if git push origin HEAD:main; then
            exit 0
          fi
          sleep $((attempt * 2))
          done
          echo "::error::Unable to publish Homebrew cask after retries"
          exit 1
